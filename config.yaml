max_books_per_epoch: 5
min_book_length: 500_000

llm_model: "SpeakLeash/bielik-minitron-7B-v3.0-instruct:Q4_K_M"
max_chunk_size: 15000
system_prompt: >
  Jesteś ekspertem analizy literackiej. Przeanalizuj poniższy fragment polskiej
  książki i wyodrębnij interakcje między postaciami. 

  ZASADY KRYTYCZNE: 1. POSTACIE: Zwracaj WYŁĄCZNIE interakcje między dwiema
  istotami (ludźmi, ew. zwierzętami).  2. ZAKAZANE SŁOWA: Ignoruj pojęcia
  abstrakcyjne (np. romantyzm, los, czas), przedmioty i miejsca. Nigdy nie
  używaj wartości "N/A" czy "None". Jeśli postać jest sama w scenie, nie twórz
  dla niej interakcji. 3. JĘZYK: Wszystkie wyodrębnione imiona i nazwy postaci
  muszą być w języku polskim.

  Określ sentyment interakcji, używając WYŁĄCZNIE jednej z poniższych
  wartości:  - "bardzo_pozytywna" (np. głęboka miłość, wielkie poświęcenie,
  ratowanie życia) - "pozytywna" (np. uprzejmość, codzienne wsparcie, miła
  rozmowa) - "neutralna" (np. formalne wymiany zdań, przekazywanie suchych
  informacji) - "negatywna" (np. zwykła kłótnia, niechęć, złośliwość) -
  "bardzo_negatywna" (np. czysta nienawiść, zdrada, przemoc, atak)

  Oczekiwany format odpowiedzi to czysty JSON zgodny ze schematem. Przykłady
  poprawnych relacji: {"interactions": [
    {"character_1": "Romeo", "character_2": "Julia", "interaction_sentiment": "bardzo_pozytywna"},
    {"character_1": "Wokulski", "character_2": "Łęcka", "interaction_sentiment": "negatywna"},
    {"character_1": "Makbet", "character_2": "Banko", "interaction_sentiment": "bardzo_negatywna"}
  ]}

ollama_options:
  temperature: 0.1
  num_ctx: 8192
  num_gpu: 99
  top_k: 10
  top_p: 0.5

interactions_directory: ./data/book_interactions_data
graphs_directory: ./data/graphs/
notebooks_directory: ./notebooks
epoch_mapping:
  20_000_mil_podmorskiej_zeglugi: pozytywizm
  alejchem_z_jarmarku: modernizm
  aleksander_dumas_trzej_muszkieterowie_tom_2: romantyzm
  amicis_serce: modernizm
  andersen_tylko_grajek: romantyzm
  balzac_komedia_ludzka_jaszczur: romantyzm
  balzac_komedia_ludzka_stracone_zludzenia_wielki_czlowiek_z_prowincji: romantyzm
  berent_prochno: mloda-polska-modernizm
  bez_dogmatu: pozytywizm
  bronte_dziwne_losy_jane_eyre: romantyzm
  brzozowski_plomienie: mloda-polska-modernizm
  chata_za_wsia: pozytywizm
  cnotliwi: barok
  conrad_nostromo: modernizm
  darwin_o_powstawaniu_gatunkow: pozytywizm
  don_kichot_z_la_manchy: barok
  gargantua_i_pantagruel: renesans
  o_poprawie_rzeczypospolitej: renesans
  pamietniki: barok
  pascal_mysli: barok
  potocki_transakcja_wojny_chocimskiej: barok
  proby_ksiega_druga: renesans
  proby_ksiega_pierwsza: renesans
  proby_ksiega_trzecia: renesans
  prowincjalki: barok
atagonist_treshold: -0.5
protagonist_threshold: 0.5
