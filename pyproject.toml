[build-system]
requires = ["setuptools>=82.0.1", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "project"
version = "0.2.0"
description = "Analysis of character relationship networks in Polish literature across epochs"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "diskcache>=5.6.3",
    "httpx>=0.28.1",
    "loguru>=0.7.3",
    "tqdm>=4.67.1",
    "google-genai>=1.74.0",
    "python-dotenv>=1.2.2",
    "networkx>=3.6.1",
    "python-louvain>=0.16",
    "matplotlib>=3.10.9",
    "seaborn>=0.13.2",
    "scikit-learn>=1.8.0",
    "pyvis>=0.3.2",
]

[tool.setuptools.packages.find]
where = ["novels_analysis"]

[tool.uv]
package = true